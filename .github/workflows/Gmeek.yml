name: Gmeek

on:
  issues:
    types: [opened, edited, labeled, unlabeled, deleted, milestoned, demilestoned, pinned, unpinned, reopened]
  workflow_dispatch:
    inputs:
      clean_cache:
        description: "清除缓存并强制全量重新生成"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Download Gmeek.py
        run: |
          curl -fsSL https://raw.githubusercontent.com/Meekdai/Gmeek/main/Gmeek.py -o Gmeek.py
          curl -fsSL https://raw.githubusercontent.com/Meekdai/Gmeek/main/requirements.txt -o requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Clean cache (if requested)
        if: ${{ inputs.clean_cache }}
        run: rm -rf backup/ docs/ post.html postjson/

      - name: Build Gmeek
        run: python Gmeek.py ${{ secrets.GITHUB_TOKEN }} ${{ github.repository }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
